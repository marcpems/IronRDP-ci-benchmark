name: Repeat x64 PGO release pair in reverse order
on:
  push:
    branches: [experiment/x64-pgo-reverse]
permissions:
  contents: read
  actions: read
concurrency:
  group: matched-x64-selfhost
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'marcpems/IronRDP-ci-benchmark'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Inspect runner without changing machine settings
        shell: powershell
        run: .github\scripts\x64_pgo_preflight.ps1 -Output "$env:RUNNER_TEMP\x64-pgo-preflight-$env:GITHUB_RUN_ID.json"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: x64-pgo-preflight
          path: ${{ runner.temp }}/x64-pgo-preflight-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 30
  local:
    needs: preflight
    uses: ./.github/workflows/x64-pgo-release-cell.yml
    with:
      variant: local
      reference_run: "39456859889"
  upstream:
    needs: local
    uses: ./.github/workflows/x64-pgo-release-cell.yml
    with:
      variant: upstream
