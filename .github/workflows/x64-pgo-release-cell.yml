name: Build one fresh x64 PGO full distribution
on:
  workflow_call:
    inputs:
      variant:
        type: string
        required: true
      reference_run:
        type: string
        default: ""
        description: Qualified upstream evidence for a reverse-order local-first pair
permissions:
  contents: read
  actions: read
jobs:
  release:
    if: github.repository == 'marcpems/IronRDP-ci-benchmark'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 1440
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      VSCMD_SKIP_SENDTELEMETRY: "1"
      PGO_VARIANT: ${{ inputs.variant }}
    steps:
      - name: Reserve fresh isolated build paths on NVMe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'MARCPE-TEST01-X64') { throw 'Unexpected runner' }
          if ($env:PGO_VARIANT -notin @('upstream','local')) { throw 'Unknown release variant' }
          $disk = Get-Disk -Number (Get-Partition -DriveLetter C).DiskNumber
          if ($disk.BusType -ne 'NVMe' -or $disk.FriendlyName -ne 'PC SN810 NVMe WDC 512GB') {
            throw 'C: is no longer the qualified NVMe device'
          }
          if ((Get-Volume -DriveLetter C).SizeRemaining -lt 180GB) { throw 'Insufficient NVMe capacity' }
          "PGO_CELL_STARTED=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV
          $root = "C:\q$($env:GITHUB_RUN_ID.Substring($env:GITHUB_RUN_ID.Length - 8))$($env:PGO_VARIANT.Substring(0,1))"
          if (Test-Path -LiteralPath $root) { throw "Refusing to reuse $root" }
          New-Item -ItemType Directory "$root\e" | Out-Null
          $env:GITHUB_RUN_ID | Set-Content -LiteralPath "$root\owner-run.txt"
          "PGO_ROOT=$root" >> $env:GITHUB_ENV
          "GIT_CONFIG_COUNT=2" >> $env:GITHUB_ENV
          "GIT_CONFIG_KEY_0=core.autocrlf" >> $env:GITHUB_ENV
          "GIT_CONFIG_VALUE_0=false" >> $env:GITHUB_ENV
          "GIT_CONFIG_KEY_1=core.longpaths" >> $env:GITHUB_ENV
          "GIT_CONFIG_VALUE_1=true" >> $env:GITHUB_ENV
      - uses: actions/checkout@v6
        with:
          path: harness
          persist-credentials: false
      - name: Record fresh idle-state inventory
        shell: powershell
        run: |
          harness\.github\scripts\x64_pgo_preflight.ps1 -Output "$env:PGO_ROOT\e\readiness.json"
      - name: Check out pinned Rust directly on NVMe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = "$env:PGO_ROOT\r"
          if (Test-Path -LiteralPath $source) { throw 'Expected a fresh source directory' }
          git init --quiet $source
          if ($LASTEXITCODE) { throw 'Cannot initialize isolated source checkout' }
          git -C $source remote add origin https://github.com/rust-lang/rust.git
          if ($LASTEXITCODE) { throw 'Cannot configure public source remote' }
          git -C $source fetch --quiet --depth 1 origin e408947bfd200af42db322daf0fadfe7e26d3bd1
          if ($LASTEXITCODE) { throw 'Pinned source fetch failed' }
          git -C $source checkout --quiet --detach FETCH_HEAD
          if ($LASTEXITCODE) { throw 'Pinned source checkout failed' }
          git -C $source submodule update --init --recursive --depth 1 --jobs 4
          if ($LASTEXITCODE) { throw 'Pinned submodule checkout failed' }
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: x64
      - name: Install pinned tools into this experiment only
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = "$env:PGO_ROOT\r\citools"
          New-Item -ItemType Directory "$tools\clang-rust","$env:PGO_ROOT\r\wix\bin" | Out-Null
          curl.exe --fail --location --retry 3 https://ci-mirrors.rust-lang.org/rustc/LLVM-20.1.3-win64.exe --output "$tools\LLVM-20.1.3-win64.exe"
          if ($LASTEXITCODE) { throw 'Clang download failed' }
          7z x "-o$tools\clang-rust" "$tools\LLVM-20.1.3-win64.exe" -y | Out-Null
          if ($LASTEXITCODE) { throw 'Clang extraction failed' }
          curl.exe --fail --location --retry 3 https://ci-mirrors.rust-lang.org/rustc/wix311-binaries.zip --output "$tools\wix311-binaries.zip"
          if ($LASTEXITCODE) { throw 'WIX download failed' }
          7z x "-o$env:PGO_ROOT\r\wix\bin" "$tools\wix311-binaries.zip" -y | Out-Null
          if ($LASTEXITCODE) { throw 'WIX extraction failed' }
      - name: Obtain upstream reference provenance
        if: inputs.variant == 'local'
        uses: actions/download-artifact@v6
        with:
          name: x64-pgo-upstream-evidence
          path: ${{ env.PGO_ROOT }}/reference
          run-id: ${{ inputs.reference_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Build and qualify complete PGO distribution
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $arguments = @('--root', $env:PGO_ROOT, '--variant', $env:PGO_VARIANT)
          if ($env:PGO_VARIANT -eq 'local') { $arguments += @('--reference', "$env:PGO_ROOT\reference") }
          harness\.github\scripts\invoke_msvc_experiment.ps1 -Architecture x64 -Script harness\.github\scripts\x64_pgo_release.py @arguments
      - name: Preserve evidence and profiles, including failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: x64-pgo-${{ inputs.variant }}-evidence
          path: |
            ${{ env.PGO_ROOT }}/e/*.json
            ${{ env.PGO_ROOT }}/e/*.jsonl
            ${{ env.PGO_ROOT }}/e/*.txt
            ${{ env.PGO_ROOT }}/e/*.toml
            ${{ env.PGO_ROOT }}/e/*.cmake
            ${{ env.PGO_ROOT }}/e/*.profdata
            ${{ env.PGO_ROOT }}/e/*.stdout
            ${{ env.PGO_ROOT }}/e/*.stderr
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
      - name: Retain every qualified distribution artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: x64-pgo-${{ inputs.variant }}-dist
          path: ${{ env.PGO_ROOT }}/r/build/dist
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Reclaim only this job's generated build directory after successful preservation
        if: success()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = "C:\q$($env:GITHUB_RUN_ID.Substring($env:GITHUB_RUN_ID.Length - 8))$($env:PGO_VARIANT.Substring(0,1))"
          if ($env:PGO_ROOT -ne $expected) { throw 'Unexpected cleanup root' }
          if ((Get-Content -LiteralPath "$expected\owner-run.txt").Trim() -ne $env:GITHUB_RUN_ID) { throw 'Ownership check failed' }
          $result = Get-Content -Raw -LiteralPath "$expected\e\result.json" | ConvertFrom-Json
          if (!$result.complete) { throw 'Unqualified build must remain for diagnosis' }
          $build = Get-Item -LiteralPath "$expected\r\build"
          if ($build.Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Refusing redirected build directory' }
          Remove-Item -LiteralPath $build.FullName -Recurse -Force
