name: Recover setup-failed factorial both-ThinLTO producer
on:
  push:
    branches: [experiment/x64-factorial-recovery]
    paths:
      - .github/workflows/x64-factorial-both-recovery.yml
      - .github/scripts/x64_factorial_thin.py
      - .github/scripts/x64_rust_thin_incremental.py
      - ci-benchmark/x64-factorial-recovery.json
permissions:
  contents: read
  actions: read
concurrency:
  group: hosted-x64-factorial-thin-recovery
  cancel-in-progress: false
defaults:
  run:
    shell: pwsh
env:
  PYTHONDONTWRITEBYTECODE: "1"
  VSCMD_SKIP_SENDTELEMETRY: "1"
  GIT_CONFIG_COUNT: "2"
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: "true"
  GIT_CONFIG_KEY_1: core.autocrlf
  GIT_CONFIG_VALUE_1: "false"
jobs:
  compiler:
    if: github.repository == 'marcpems/IronRDP-ci-benchmark'
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Require the original hosted image and fresh paths
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_ARCH -ne 'X64') { throw 'Hosted X64 only' }
          if ($env:ImageVersion -ne '20261026.347.1') { throw 'Hosted image changed; do not mix this build with the frozen producers' }
          "THIN_JOB_STARTED=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV
          if (Test-Path D:\ri) { throw 'Build path already exists' }
          New-Item -ItemType Directory D:\ri\e | Out-Null
          @{
            Runner=$env:RUNNER_NAME; Image=$env:ImageVersion
            Cpu=@(Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors)
            System=Get-CimInstance Win32_ComputerSystem | Select-Object NumberOfLogicalProcessors,TotalPhysicalMemory
          } | ConvertTo-Json -Depth 6 | Set-Content D:\ri\e\hardware.json
      - uses: actions/checkout@v6
        with:
          path: harness
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: x64
      - name: Validate unchanged experiment and strict recovery gates
        run: |
          python -m unittest discover -s harness\.github\scripts -p test_x64_factorial_thin.py
          if ($LASTEXITCODE) { throw 'Factorial tests failed' }
      - uses: actions/download-artifact@v6
        timeout-minutes: 10
        with:
          github-token: ${{ github.token }}
          run-id: 41116552933
          name: factorial-baseline-evidence
          path: D:\ri\reference
      - uses: actions/download-artifact@v6
        timeout-minutes: 10
        with:
          github-token: ${{ github.token }}
          run-id: 40170434889
          artifact-ids: 12593394360
          merge-multiple: true
          path: D:\ri\profiles
      - name: Fetch exact source and retry interrupted submodule downloads
        timeout-minutes: 20
        run: |
          git init --quiet D:\ri\r
          if ($LASTEXITCODE) { throw 'Source init failed' }
          git -C D:\ri\r remote add origin https://github.com/marcpems/rust-arm64-compiler-ab.git
          if ($LASTEXITCODE) { throw 'Source remote failed' }
          git -C D:\ri\r fetch --quiet --depth 1 origin 4da678aada4683607acbd67a8da37a320c791f93
          if ($LASTEXITCODE) { throw 'Source fetch failed' }
          git -C D:\ri\r checkout --quiet --detach FETCH_HEAD
          if ($LASTEXITCODE) { throw 'Source checkout failed' }
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git -C D:\ri\r submodule update --init --recursive --depth 1 --jobs 4
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw 'Pinned submodule checkout failed after three attempts' }
            Write-Warning "Submodule attempt $attempt failed; retrying the same pinned checkout in 30s"
            Start-Sleep -Seconds 30
          }
      - name: Extract pinned Clang and LLD without modifying the hosted installation
        timeout-minutes: 10
        run: |
          curl.exe --fail --location --retry 3 https://ci-mirrors.rust-lang.org/rustc/LLVM-20.1.3-win64.exe -o D:\ri\LLVM-20.1.3-win64.exe
          if ($LASTEXITCODE) { throw 'Clang download failed' }
          if ((Get-FileHash D:\ri\LLVM-20.1.3-win64.exe).Hash.ToLowerInvariant() -ne '0a18ea761147a7de69d6dd60ef81b70496e5255aec6caff22d45da85188614af') { throw 'Clang checksum mismatch' }
          7z x -y -bd -bso0 -oD:\ri\clang D:\ri\LLVM-20.1.3-win64.exe
          if ($LASTEXITCODE) { throw 'Clang extraction failed' }
      - name: Match retained baseline identity then build only the missing compiler
        timeout-minutes: 335
        run: |
          harness\.github\scripts\invoke_msvc_experiment.ps1 -Architecture x64 -Script harness\.github\scripts\x64_factorial_thin.py build --root D:\ri --variant both-thin --reference D:\ri\reference\result.json
      - name: Preserve recovery evidence including failures
        if: always()
        uses: actions/upload-artifact@v6
        timeout-minutes: 10
        with:
          name: factorial-both-thin-evidence
          path: |
            D:\ri\e\*.json
            D:\ri\e\*.stdout
            D:\ri\e\*.stderr
            D:\ri\e\*.toml
            D:\ri\e\*.cmake
            D:\ri\e\*.patch
            D:\ri\e\*.txt
          retention-days: 30
          compression-level: 1
      - name: Transfer the completed recovery package and manifest
        uses: actions/upload-artifact@v6
        timeout-minutes: 15
        with:
          name: factorial-both-thin-package
          path: |
            D:\ri\package.zip
            D:\ri\e\result.json
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
