name: GB300 runner dispatch probe
on:
  push:
    branches: [experiment/gb300-dispatch-probe]
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'marcpems/IronRDP-ci-benchmark'
    runs-on: [self-hosted, Windows, ARM64, HighCoreCount]
    timeout-minutes: 5
    concurrency:
      group: matched-highcore-arm64-selfhost
      cancel-in-progress: false
    steps:
      - name: Confirm fresh job delivery without starting a build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'GB300-Arm64') { throw 'Unexpected runner' }
          @{Runner=$env:RUNNER_NAME; Architecture=$env:RUNNER_ARCH;
            LogicalCPUs=[Environment]::ProcessorCount; UTC=[DateTime]::UtcNow.ToString('o')} |
            ConvertTo-Json
      - name: Check for surviving work from the disconnected release
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $processes = @(Get-CimInstance Win32_Process)
          $ancestors = @()
          $cursor = $PID
          while ($cursor -ne 0 -and $cursor -notin $ancestors) {
            $ancestors += $cursor
            $parent = $processes | Where-Object ProcessId -eq $cursor
            if (!$parent) { break }
            $cursor = $parent.ParentProcessId
          }
          $workers = @($processes | Where-Object {
            $_.Name -eq 'Runner.Worker.exe' -and $_.ProcessId -notin $ancestors
          })
          $tools = @('git.exe','curl.exe','7z.exe','cmake.exe','ninja.exe',
            'clang-cl.exe','cl.exe','link.exe','lib.exe','rustc.exe','rustdoc.exe',
            'cargo.exe','opt-dist.exe','bootstrap.exe')
          $leftovers = @($processes | Where-Object {
            $_.ProcessId -notin $ancestors -and
            ($_.Name -in $tools -or $_.CommandLine -like '*D:\m23101166t32r1*')
          })
          $workers + $leftovers | Select-Object Name,ProcessId,ParentProcessId |
            ConvertTo-Json
          if ($workers.Count -or $leftovers.Count) {
            throw 'Potential surviving or concurrent work detected; investigate without killing processes'
          }
          $drive = [IO.DriveInfo]::new('D:\')
          @{Format=$drive.DriveFormat; FreeBytes=$drive.AvailableFreeSpace;
            OtherWorkers=$workers.Count; BuildProcesses=$leftovers.Count} | ConvertTo-Json
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: arm64
      - name: Exercise every selected and excluded CPU under real job limits
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path(".github/scripts").resolve()))
          from msvc_experiment import execute
          root = Path(os.environ["RUNNER_TEMP"]) / ("gb300-affinity-" + os.environ["GITHUB_RUN_ID"])
          root.mkdir(exist_ok=False)
          for cores in (32, 16, 4):
              name = f"affinity-{cores}"
              execute([sys.executable, Path(".github/scripts/windows_job_affinity.py").resolve(), str(cores)],
                      Path.cwd(), dict(os.environ), root, name, timeout=60, cores=cores)
              result = json.loads((root / f"{name}.stdout").read_text())
              assert len(result["exercised"]) == cores
              assert len(result["excluded_rejected"]) == sum(result["group_counts"]) - cores
              print(json.dumps({"cores": cores, **result}), flush=True)
          '@ | python -
          if ($LASTEXITCODE) { throw 'Native group-affinity probe failed' }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gb300-scaling-affinity
          path: ${{ runner.temp }}/gb300-affinity-${{ github.run_id }}
          retention-days: 30
