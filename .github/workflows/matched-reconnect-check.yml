name: Check reconnected scaling runner before fresh work
on:
  workflow_call:
    inputs:
      machine:
        type: string
        required: true
      archived_gb300_evidence:
        description: Use the preserved GB300 failed-run evidence after local disk cleanup
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  check:
    if: github.repository == 'marcpems/IronRDP-ci-benchmark'
    runs-on: ${{ fromJSON(inputs.machine == 'x64' && '["self-hosted","Windows","X64"]' || '["self-hosted","Windows","ARM64","HighCoreCount"]') }}
    concurrency:
      group: ${{ inputs.machine == 'x64' && 'matched-x64-selfhost' || 'matched-highcore-arm64-selfhost' }}
      cancel-in-progress: false
    timeout-minutes: 10
    env:
      MACHINE: ${{ inputs.machine }}
      ARCHIVED_GB300_EVIDENCE: ${{ inputs.archived_gb300_evidence }}
    steps:
      - name: Retrieve preserved GB300 interrupted-run evidence
        if: inputs.archived_gb300_evidence
        uses: actions/download-artifact@v6
        with:
          name: reconnected-arm64-highcore-interrupted-evidence
          run-id: 38869810910
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/gb300-prior-evidence-${{ github.run_id }}
      - name: Check prior job, process isolation and available storage
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cases = @{
            x64 = @{Runner='MARCPE-TEST01-X64'; Root='E:\m16997224t4r1'; Run='38716997224'; Job='116693884027'; Cores=4}
            'arm64-highcore' = @{Runner='GB300-Arm64'; Root='D:\m31573412t32r1'; Run='38731573412'; Job='116410369649'; Cores=32}
          }
          if (!$cases.ContainsKey($env:MACHINE)) { throw 'Unexpected recovery machine' }
          $case = $cases[$env:MACHINE]
          if ($env:RUNNER_NAME -ne $case.Runner) { throw 'Unexpected recovery runner' }
          $staging = Join-Path $env:RUNNER_TEMP "scaling-reconnection-$($env:GITHUB_RUN_ID)-$($env:MACHINE)"
          New-Item -ItemType Directory -Path $staging | Out-Null
          "RECONNECT_EVIDENCE=$staging" >> $env:GITHUB_ENV
          $headers = @{Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'}
          $job = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/marcpems/IronRDP-ci-benchmark/actions/jobs/$($case.Job)"
          if ($job.status -ne 'completed' -or $job.conclusion -ne 'failure' -or "$($job.run_id)" -ne $case.Run) {
            throw 'Prior release is not the expected failed job'
          }
          $evidence = "$($case.Root)\e"
          $evidenceOrigin = 'retained-local'
          if ($env:ARCHIVED_GB300_EVIDENCE -eq 'true') {
            if ($env:MACHINE -ne 'arm64-highcore') { throw 'Archived evidence is restricted to GB300' }
            $previous = Join-Path $env:RUNNER_TEMP "gb300-prior-evidence-$($env:GITHUB_RUN_ID)"
            $receipt = Get-Content -LiteralPath "$previous\scaling-reconnection.json" -Raw | ConvertFrom-Json
            if ($receipt.Runner -ne $case.Runner -or $receipt.FailedJob -ne $case.Job -or
                $receipt.FailedRoot -ne $case.Root -or $receipt.RecoveryRun -ne '38869810910' -or
                $null -eq $receipt.Processes -or @($receipt.Processes).Count -ne 0) {
              throw 'Archived GB300 reconnection receipt identity mismatch'
            }
            $evidence = Join-Path $previous 'interrupted'
            $evidenceOrigin = 'archived-run-38869810910'
            Write-Output 'Using archived failed-run provenance; live process and storage checks still apply'
          }
          "RECONNECT_SOURCE=$evidence" >> $env:GITHUB_ENV
          $provenance = Get-Content -LiteralPath "$evidence\provenance.json" -Raw | ConvertFrom-Json
          if ($provenance.run_id -ne $case.Run -or $provenance.runner_name -ne $case.Runner -or
              $provenance.variant -ne 'msvc-pgo-rust-thin' -or $provenance.build_affinity_count -ne $case.Cores -or
              $provenance.paths.source -ne "$($case.Root)\r") {
            throw 'Unexpected retained release provenance'
          }
          $historicalCase = $case
          $historicalEvidenceOrigin = $evidenceOrigin
          if ($env:MACHINE -eq 'arm64-highcore') {
            $case = @{Runner='GB300-Arm64'; Root='D:\m03042998t32r1'; Run='38903042998'; Job='116979807783'; Cores=32}
            $latestJob = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/marcpems/IronRDP-ci-benchmark/actions/jobs/$($case.Job)"
            if ($latestJob.status -ne 'completed' -or $latestJob.conclusion -ne 'failure' -or
                "$($latestJob.run_id)" -ne $case.Run -or $latestJob.run_attempt -ne 1 -or
                $latestJob.runner_name -ne $case.Runner) {
              throw 'Latest GB300 interruption is not the expected failed release'
            }
            $evidence = "$($case.Root)\e"
            $evidenceOrigin = 'retained-local-latest-interruption'
            "RECONNECT_SOURCE=$evidence" >> $env:GITHUB_ENV
            $latest = Get-Content -LiteralPath "$evidence\provenance.json" -Raw | ConvertFrom-Json
            if ($latest.run_id -ne $case.Run -or $latest.attempt -ne '1' -or
                $latest.runner_name -ne $case.Runner -or $latest.runner_class -ne 'self-hosted-arm64-highcore' -or
                $latest.variant -ne 'msvc-pgo-rust-thin' -or $latest.scaling_study -ne 'msvc-rust-thin-scaling-v1' -or
                $latest.build_jobs -ne $case.Cores -or $latest.build_affinity_count -ne $case.Cores -or
                $latest.rust_sha -ne '7db17d9b5bbe6b16be2dc86b4bfae81d6e1ae238' -or
                $latest.paths.source -ne "$($case.Root)\r") {
              throw 'Latest GB300 local provenance mismatch; historical archive cannot replace it'
            }
          }
          $processes = @(Get-CimInstance Win32_Process)
          $ancestors = @()
          $cursor = $PID
          while ($cursor -ne 0 -and $cursor -notin $ancestors) {
            $ancestors += $cursor
            $parent = $processes | Where-Object ProcessId -eq $cursor
            if (!$parent) { break }
            $cursor = $parent.ParentProcessId
          }
          $blockers = @($processes | Where-Object {
            $_.ProcessId -notin $ancestors -and
            ($_.Name -eq 'Runner.Worker.exe' -or
             $_.CommandLine -like "*$($case.Root)*" -or
             $_.CommandLine -like "*$($historicalCase.Root)*" -or
             ($_.Name -eq 'python.exe' -and $_.CommandLine -match 'matched_release\.py|build_arm_compilers\.py|\s-\s*$') -or
             $_.Name -in @('cmake.exe','ninja.exe','clang-cl.exe','cl.exe','link.exe',
                          'rustc.exe','rustdoc.exe','cargo.exe','opt-dist.exe','bootstrap.exe'))
          })
          $drive = [IO.DriveInfo]::new([IO.Path]::GetPathRoot($case.Root))
          $report = @{
            Runner=$env:RUNNER_NAME; FailedJob=$case.Job; FailedRoot=$case.Root
            HistoricalFailedJob=$historicalCase.Job; HistoricalFailedRoot=$historicalCase.Root
            HistoricalEvidenceOrigin=$historicalEvidenceOrigin
            RecoveryRun=$env:GITHUB_RUN_ID
            EvidenceOrigin=$evidenceOrigin; FailedRootPresent=(Test-Path -LiteralPath $case.Root)
            UTC=[DateTime]::UtcNow.ToString('o')
            LastBootUTC=(Get-CimInstance Win32_OperatingSystem).LastBootUpTime.ToUniversalTime().ToString('o')
            FreeBytes=$drive.AvailableFreeSpace; DriveFormat=$drive.DriveFormat
            RetainedVolumeFreeBytes=([IO.DriveInfo]::new('C:\')).AvailableFreeSpace
            Processes=@($blockers | Select-Object Name,ProcessId,ParentProcessId,CreationDate)
          }
          $report | ConvertTo-Json -Depth 5 |
            Set-Content -Encoding UTF8 -LiteralPath "$staging\scaling-reconnection.json"
          $report | ConvertTo-Json -Depth 5
          if ($blockers.Count) {
            throw 'Surviving or concurrent work detected; no process was killed and no release was restarted'
          }
      - name: Stage interrupted-release evidence under one physical upload root
        if: always() && env.RECONNECT_EVIDENCE != '' && env.RECONNECT_SOURCE != ''
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = $env:RECONNECT_SOURCE
          $destination = Join-Path $env:RECONNECT_EVIDENCE 'interrupted'
          New-Item -ItemType Directory -Path $destination | Out-Null
          Get-ChildItem -LiteralPath $source -File |
            Where-Object Extension -in @('.json','.stdout','.stderr') |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $destination }
      - name: Preserve reconnection diagnostics and interrupted-release evidence
        if: always() && env.RECONNECT_EVIDENCE != ''
        uses: actions/upload-artifact@v6
        with:
          name: reconnected-${{ inputs.machine }}-interrupted-evidence
          path: ${{ env.RECONNECT_EVIDENCE }}
          retention-days: 30
          compression-level: 1
