name: Continue qualified x64 profile-only comparison
on:
  push:
    branches: [experiment/x64-profile-continue]
permissions:
  contents: read
  actions: read
concurrency:
  group: matched-x64-selfhost
  cancel-in-progress: false
jobs:
  preserve:
    if: github.repository == 'marcpems/IronRDP-ci-benchmark'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: x64
      - name: Validate and preserve the completed control and separate qualification
        shell: powershell
        run: |
          python .github\scripts\preserve_x64_profile_control.py
          if ($LASTEXITCODE) { throw 'Qualified control preservation failed' }
      - uses: actions/upload-artifact@v6
        with:
          name: x64-profile-official-evidence
          path: ${{ env.PRESERVED_CONTROL }}
          retention-days: 30
          compression-level: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: x64-profile-official-dist
          path: D:/p957762891/r/build/dist
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - name: Reclaim only the preserved control source so the next build starts clean
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'D:\p957762891'
          if ((Get-Content "$root\owner-run.txt").Trim() -ne '39595776289/1') { throw 'Wrong original owner' }
          if ((Get-Content "$root\pair-run.txt").Trim() -ne "$env:GITHUB_RUN_ID/$env:GITHUB_RUN_ATTEMPT") { throw 'Wrong continuation owner' }
          $result = Get-Content -Raw "$env:PRESERVED_CONTROL\result.json" | ConvertFrom-Json
          if (!$result.complete -or !$result.recovered_control -or $result.qualification_run_id -ne '39608556774') { throw 'Unqualified control' }
          $source = Get-Item -LiteralPath "$root\r"
          if ($source.Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Refusing redirected source' }
          Remove-Item -LiteralPath $source.FullName -Recurse -Force
  repaired:
    needs: preserve
    uses: ./.github/workflows/x64-profile-only-cell.yml
    with:
      variant: repaired
      retained_control: true
  replay:
    needs: repaired
    uses: ./.github/workflows/x64-profile-replay-cell.yml
