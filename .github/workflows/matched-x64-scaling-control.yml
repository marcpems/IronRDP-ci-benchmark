name: Recover x64 and finish fresh four-CPU scaling control
on:
  push:
    branches: [experiment/msvc-rust-thin-scaling-x64-control]
permissions:
  contents: read
  actions: read
jobs:
  ready:
    uses: ./.github/workflows/matched-reconnect-check.yml
    with:
      machine: x64
  preserve:
    needs: ready
    if: github.repository == 'marcpems/IronRDP-ci-benchmark'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    concurrency:
      group: matched-x64-selfhost
      cancel-in-progress: false
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: x64
      - uses: actions/download-artifact@v6
        with:
          name: reconnected-x64-interrupted-evidence
          path: recovery-evidence
      - name: Preserve interrupted build with verified checksums before reclaiming E
        shell: powershell
        run: |
          python .github\scripts\relocate_failed_scaling_build.py --machine x64 --reconnection-report recovery-evidence\scaling-reconnection.json
          if ($LASTEXITCODE) { throw 'Verified interrupted-build relocation failed' }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: x64-interrupted-build-relocation
          path: C:\matched-retained\m16997224t4r1-${{ github.run_id }}\relocation.json
          retention-days: 30
  x64-4:
    needs: preserve
    uses: ./.github/workflows/matched-scaling-cell.yml
    with:
      machine: x64
      cores: 4
