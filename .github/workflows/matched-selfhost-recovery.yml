name: Recover matched self-hosted build space
on:
  push:
    branches: [experiment/matched-selfhost-recovery, experiment/matched-selfhost-reclaim, experiment/matched-selfhost-preflight-reclaim, experiment/matched-selfhost-postrelease-inventory]
  workflow_dispatch:
    inputs:
      reclaim:
        description: Preserve verified baseline archives and reclaim only their build subdirectory
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'marcpems/IronRDP-ci-benchmark'
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON((endsWith(github.ref_name, '-preflight-reclaim') || endsWith(github.ref_name, '-postrelease-inventory')) && '["gb300"]' || '["gb300","x64"]') }}
    runs-on: ${{ fromJSON(matrix.machine == 'gb300' && '["self-hosted","Windows","ARM64","HighCoreCount"]' || '["self-hosted","Windows","X64"]') }}
    concurrency:
      group: ${{ matrix.machine == 'gb300' && 'matched-highcore-arm64-selfhost' || 'matched-x64-selfhost' }}
      cancel-in-progress: false
    timeout-minutes: 90
    env:
      RECLAIM: ${{ inputs.reclaim || endsWith(github.ref_name, '-reclaim') }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Inspect only experiment-owned build directories
        if: env.RECLAIM != 'true' && !endsWith(github.ref_name, '-postrelease-inventory')
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = if ('${{ matrix.machine }}' -eq 'gb300') { 'GB300-Arm64' } else { 'MARCPE-TEST01-X64' }
          if ($env:RUNNER_NAME -ne $expected) { throw 'Unexpected recovery runner' }
          Get-CimInstance Win32_LogicalDisk -Filter 'DriveType=3' | Select-Object DeviceID,Size,FreeSpace | ConvertTo-Json
          $roots = if ('${{ matrix.machine }}' -eq 'gb300') {
            @('D:\v47351434', 'D:\v47985162', 'D:\m48685449b1', 'D:\m82254692b1')
          } else {
            @('E:\m31778023', 'E:\m36237914b1', 'E:\m36237914m1', 'E:\m36237914l1')
          }
          foreach ($root in $roots) {
            foreach ($part in @('r\build', 'r\build\dist', 'r\opt-artifacts', 'e')) {
              $path = Join-Path $root $part
              if (Test-Path -LiteralPath $path) {
                $files = Get-ChildItem -LiteralPath $path -File -Recurse -Force | Measure-Object Length -Sum
                @{Path=$path; Files=$files.Count; Bytes=$files.Sum} | ConvertTo-Json -Compress
              }
            }
          }
      - name: Inspect remaining completed-release training and runtime caches
        if: endsWith(github.ref_name, '-postrelease-inventory')
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'GB300-Arm64') { throw 'Unexpected inventory runner' }
          Get-CimInstance Win32_LogicalDisk -Filter 'DriveType=3' | Select-Object DeviceID,Size,FreeSpace | ConvertTo-Json
          foreach ($root in @('D:\m68036985m1','D:\m82254692b1','D:\m48685449b1')) {
            foreach ($part in @('r\build','r\opt-artifacts','r\src\tools\rustc-perf','e','retained-dist')) {
              $path = Join-Path $root $part
              if (!(Test-Path -LiteralPath $path)) { continue }
              $files = Get-ChildItem -LiteralPath $path -File -Recurse -Force | Measure-Object Length -Sum
              @{Path=$path; Files=$files.Count; Bytes=$files.Sum} | ConvertTo-Json -Compress
              if ($part -in @('r\opt-artifacts','r\src\tools\rustc-perf','e')) {
                foreach ($child in Get-ChildItem -LiteralPath $path -Directory) {
                  $files = Get-ChildItem -LiteralPath $child.FullName -File -Recurse -Force | Measure-Object Length -Sum
                  @{Path=$child.FullName; Files=$files.Count; Bytes=$files.Sum} | ConvertTo-Json -Compress
                }
              }
            }
          }
      - uses: actions/checkout@v6
        if: env.RECLAIM == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        if: env.RECLAIM == 'true'
        with:
          python-version: "3.13"
          architecture: ${{ matrix.machine == 'gb300' && 'arm64' || 'x64' }}
      - name: Preserve qualified baseline and recover only its disposable build files
        if: env.RECLAIM == 'true' && !endsWith(github.ref_name, '-preflight-reclaim')
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ matrix.machine }}' -eq 'gb300') {
            python .github\scripts\recover_matched_build.py --root D:\m82254692b1 --machine self-hosted-arm64-highcore --run-id 38282254692 --variant baseline
          } else {
            python .github\scripts\recover_matched_build.py --root E:\m36237914b1 --machine self-hosted-x64 --run-id 38236237914 --variant baseline
          }
          if ($LASTEXITCODE) { throw 'Verified baseline recovery failed' }
      - name: Reclaim only the inspected successful GB300 preflight build cache
        if: endsWith(github.ref_name, '-preflight-reclaim')
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'GB300-Arm64') { throw 'Unexpected preflight recovery runner' }
          $validation = Get-Content -LiteralPath 'D:\v47985162\e\validation.json' -Raw | ConvertFrom-Json
          if (!$validation.complete -or $validation.runner -ne 'GB300-Arm64' -or $validation.build_jobs -ne 64 -or $validation.release_qualified) {
            throw 'Expected the successful native 64-CPU preflight, not release output'
          }
          foreach ($path in @('D:\v47985162','D:\v47985162\r','D:\v47985162\r\build')) {
            $item = Get-Item -LiteralPath $path -Force
            if ($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) { throw 'Redirected preflight directory' }
          }
          if (Test-Path -LiteralPath 'D:\v47985162\r\build\dist') { throw 'Unexpected distribution in preflight cache' }
          $before = [System.IO.DriveInfo]::new('D:\').AvailableFreeSpace
          python -c "import shutil; shutil.rmtree(r'D:\v47985162\r\build')"
          if ($LASTEXITCODE) { throw 'Preflight build-cache removal failed' }
          if (Test-Path -LiteralPath 'D:\v47985162\r\build') { throw 'Preflight build cache remains' }
          @{Path='D:\v47985162\r\build'; FreeBytesBefore=$before; FreeBytesAfter=[System.IO.DriveInfo]::new('D:\').AvailableFreeSpace; Complete=$true} | ConvertTo-Json
