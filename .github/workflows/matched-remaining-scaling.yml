name: Finish remaining release scaling cells after reconnection
on:
  push:
    branches: [experiment/msvc-rust-thin-scaling-remaining]
permissions:
  contents: read
  actions: read
jobs:
  x64-ready:
    uses: ./.github/workflows/matched-reconnect-check.yml
    with:
      machine: x64
  x64-4:
    needs: x64-ready
    uses: ./.github/workflows/matched-scaling-cell.yml
    with:
      machine: x64
      cores: 4
  highcore-ready:
    uses: ./.github/workflows/matched-reconnect-check.yml
    with:
      machine: arm64-highcore
  highcore-32:
    needs: highcore-ready
    uses: ./.github/workflows/matched-scaling-cell.yml
    with:
      machine: arm64-highcore
      cores: 32
  highcore-16:
    needs: highcore-32
    uses: ./.github/workflows/matched-scaling-cell.yml
    with:
      machine: arm64-highcore
      cores: 16
  highcore-4:
    needs: highcore-16
    uses: ./.github/workflows/matched-scaling-cell.yml
    with:
      machine: arm64-highcore
      cores: 4
