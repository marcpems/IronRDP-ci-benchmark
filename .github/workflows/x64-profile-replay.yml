name: Replay the qualified profile-only x64 compilers
on:
  push:
    branches: [experiment/x64-profile-replay]
permissions:
  contents: read
  actions: read
concurrency:
  group: matched-x64-selfhost
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository == 'marcpems/IronRDP-ci-benchmark'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: x64-profile-*-evidence
          path: ${{ runner.temp }}/profile-input
          run-id: "39611328907"
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v6
        with:
          pattern: x64-profile-*-dist
          path: ${{ runner.temp }}/profile-input
          run-id: "39611328907"
          github-token: ${{ github.token }}
      - uses: actions/upload-artifact@v6
        with:
          name: x64-profile-replay-inputs
          path: |
            ${{ runner.temp }}/profile-input/x64-profile-official-dist/rustc-1.94.1-x86_64-pc-windows-msvc.tar.xz
            ${{ runner.temp }}/profile-input/x64-profile-repaired-dist/rustc-1.94.1-x86_64-pc-windows-msvc.tar.xz
            ${{ runner.temp }}/profile-input/x64-profile-official-evidence/result.json
            ${{ runner.temp }}/profile-input/x64-profile-repaired-evidence/result.json
            ${{ runner.temp }}/profile-input/x64-profile-official-evidence/dist-manifest.json
            ${{ runner.temp }}/profile-input/x64-profile-repaired-evidence/dist-manifest.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
  replay:
    needs: stage
    uses: ./.github/workflows/x64-profile-replay-cell.yml
    with:
      compiler_bundle: x64-profile-replay-inputs
      release_inputs: ci-benchmark\x64-profile-replay-input.json
