name: Matched full Rust release cost
on:
  push:
    branches: [experiment/matched-release-pilot, experiment/matched-release-full, experiment/matched-release-stack-diagnostic, experiment/matched-release-llvm-pilot, experiment/matched-release-repair-stack-diagnostic, experiment/matched-release-msvc-pilot, experiment/matched-release-fresh-repair-stack-diagnostic, experiment/matched-release-selfhost-arm64-pilot, experiment/matched-release-selfhost-x64-pilot, experiment/matched-release-selfhost-arm64-highcore-pilot, experiment/matched-release-selfhost-arm64-optimized-pilot, experiment/matched-release-selfhost-x64-optimized-pilot, experiment/matched-release-selfhost-arm64-highcore-optimized-pilot]
  workflow_dispatch:
    inputs:
      pilot:
        description: One feasibility job per cell, excluded from final estimates
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
jobs:
  distribution:
    if: github.repository == 'marcpems/IronRDP-ci-benchmark'
    name: ${{ matrix.arch }} / ${{ matrix.variant }} / ${{ matrix.vm }}
    runs-on: ${{ fromJSON(contains(github.ref_name, '-highcore-') && '["self-hosted","Windows","ARM64","HighCoreCount"]' || contains(github.ref_name, '-selfhost-x64-') && '["self-hosted","Windows","X64"]' || contains(github.ref_name, '-selfhost-arm64-') && '["self-hosted","Windows","ARM64","MatchedStandardArm64"]' || matrix.arch == 'x64' && '["windows-2025"]' || '["windows-11-arm"]') }}
    timeout-minutes: ${{ contains(github.ref_name, '-selfhost-') && 1440 || 360 }}
    defaults:
      run:
        shell: ${{ contains(github.ref_name, '-selfhost-') && 'powershell' || 'pwsh' }}
    concurrency:
      group: ${{ contains(github.ref_name, '-highcore-') && 'matched-highcore-arm64-selfhost' || contains(github.ref_name, '-selfhost-') && format('matched-{0}-selfhost', matrix.arch) || format('matched-{0}-{1}-{2}-{3}', github.run_id, matrix.arch, matrix.variant, matrix.vm) }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: ${{ contains(github.ref_name, '-selfhost-') && 1 || 18 }}
      matrix:
        arch: ${{ fromJSON(contains(github.ref_name, '-selfhost-x64-') && '["x64"]' || (endsWith(github.ref_name, '-stack-diagnostic') || contains(github.ref_name, '-selfhost-arm64-')) && '["arm64"]' || '["x64","arm64"]') }}
        variant: ${{ fromJSON(endsWith(github.ref_name, '-stack-diagnostic') && '["msvc-pgo"]' || endsWith(github.ref_name, '-optimized-pilot') && '["msvc-pgo","llvm-pgo-thin"]' || endsWith(github.ref_name, '-llvm-pilot') && '["llvm-pgo-thin"]' || endsWith(github.ref_name, '-msvc-pilot') && '["baseline","msvc-pgo"]' || '["baseline","msvc-pgo","llvm-pgo-thin"]') }}
        vm: ${{ fromJSON((inputs.pilot || endsWith(github.ref_name, '-pilot') || endsWith(github.ref_name, '-stack-diagnostic')) && '[1]' || '[1,2,3]') }}
    env:
      RELEASE_PILOT: ${{ inputs.pilot || endsWith(github.ref_name, '-pilot') || endsWith(github.ref_name, '-stack-diagnostic') }}
      RELEASE_REPLICATE: ${{ matrix.vm }}
      RELEASE_MACHINE_CLASS: ${{ contains(github.ref_name, '-highcore-') && 'self-hosted-arm64-highcore' || contains(github.ref_name, '-selfhost-') && format('self-hosted-{0}', matrix.arch) || 'github-hosted' }}
      PYTHONDONTWRITEBYTECODE: "1"
      VSCMD_SKIP_SENDTELEMETRY: "1"
    steps:
      - name: Start job clock
        run: |
          $ErrorActionPreference = 'Stop'
          "RELEASE_JOB_STARTED=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV
          "GIT_CONFIG_COUNT=2" >> $env:GITHUB_ENV
          "GIT_CONFIG_KEY_0=core.longpaths" >> $env:GITHUB_ENV
          "GIT_CONFIG_VALUE_0=true" >> $env:GITHUB_ENV
          "GIT_CONFIG_KEY_1=core.autocrlf" >> $env:GITHUB_ENV
          "GIT_CONFIG_VALUE_1=false" >> $env:GITHUB_ENV
          $name = 'mr'
          if ($env:RELEASE_MACHINE_CLASS -ne 'github-hosted') {
            $expectedName = if ($env:RELEASE_MACHINE_CLASS -eq 'self-hosted-arm64-highcore') { 'GB300-Arm64' } elseif ('${{ matrix.arch }}' -eq 'x64') { 'MARCPE-TEST01-X64' } else { 'MARCPE-D4-Arm64' }
            if ($env:RUNNER_NAME -ne $expectedName) { throw 'Unexpected release runner' }
            $variantCode = @{baseline='b'; 'msvc-pgo'='m'; 'llvm-pgo-thin'='l'}['${{ matrix.variant }}']
            $name = "m$($env:GITHUB_RUN_ID.Substring($env:GITHUB_RUN_ID.Length - 8))${variantCode}${{ matrix.vm }}"
          }
          $root = Join-Path ([System.IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE)) $name
          $drive = [System.IO.DriveInfo]::new([System.IO.Path]::GetPathRoot($root))
          $storage = @{Drive=$drive.Name; AvailableBytes=$drive.AvailableFreeSpace; TotalBytes=$drive.TotalSize}
          $storage | ConvertTo-Json
          if ($env:RELEASE_MACHINE_CLASS -eq 'self-hosted-arm64-highcore' -and $drive.AvailableFreeSpace -lt 180GB) {
            throw 'High-core release requires at least 180 GiB (193.3 decimal GB) free before each variant; this is a safety floor, not a guaranteed maximum.'
          }
          if (Test-Path $root) { throw "Expected an unused short build root: $root" }
          New-Item -ItemType Directory "$root\e" | Out-Null
          $storage | ConvertTo-Json > "$root\e\storage-start.json"
          "MATCHED_ROOT=$root" >> $env:GITHUB_ENV
      - uses: actions/checkout@v6
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: marcpems/rust-arm64-compiler-ab
          ref: ${{ github.ref_name == 'experiment/matched-release-stack-diagnostic' && 'ab0afc7ee6827da442070b034830b5d69a9b537c' || '7db17d9b5bbe6b16be2dc86b4bfae81d6e1ae238' }}
          path: rust-source
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: llvm/llvm-project
          ref: ca7933e47d3a3451d81e72ac174dcb5aa28b59d1
          path: clang-runtime-source
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: ${{ matrix.arch }}
      - name: Prepare exact native sources and tools
        run: |
          $ErrorActionPreference = 'Stop'
          $source = "$env:MATCHED_ROOT\r"
          [System.IO.Directory]::Move((Resolve-Path rust-source).Path, $source)
          [System.IO.Directory]::Move((Resolve-Path clang-runtime-source).Path, "$env:MATCHED_ROOT\l")
          Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors | ConvertTo-Json > "$env:MATCHED_ROOT\e\cpu.json"
          @{ImageOS=$env:ImageOS; ImageVersion=$env:ImageVersion; RunnerArch=$env:RUNNER_ARCH} | ConvertTo-Json > "$env:MATCHED_ROOT\e\runner.json"
          git -C $source submodule update --init --recursive --depth 1 --jobs 8
          if ($LASTEXITCODE) { throw 'Submodule checkout failed' }
          $suffix = if ('${{ matrix.arch }}' -eq 'arm64') { 'woa64' } else { 'win64' }
          New-Item -ItemType Directory -Force "$source\citools\clang-rust","$source\wix\bin" | Out-Null
          curl.exe --fail --location --retry 3 "https://ci-mirrors.rust-lang.org/rustc/LLVM-22.1.8-$suffix.exe" -o "$source\citools\clang.exe"
          if ($LASTEXITCODE) { throw 'Clang download failed' }
          7z x -y -bd -bso0 "-o$source\citools\clang-rust" "$source\citools\clang.exe"
          if ($LASTEXITCODE) { throw 'Clang extraction failed' }
          curl.exe --fail --location --retry 3 https://ci-mirrors.rust-lang.org/rustc/wix311-binaries.zip -o "$source\wix\wix.zip"
          if ($LASTEXITCODE) { throw 'WIX download failed' }
          7z x -y -bd -bso0 "-o$source\wix\bin" "$source\wix\wix.zip"
          if ($LASTEXITCODE) { throw 'WIX extraction failed' }
          if ($env:RELEASE_MACHINE_CLASS -eq 'github-hosted') {
            $key = 'HKLM:\Software\Policies\Microsoft\VisualStudio\SQM'
            New-Item -Path $key -Force | Out-Null
            New-ItemProperty -Path $key -Name OptIn -PropertyType DWord -Value 0 -Force | Out-Null
          }
      - name: Download recorded profiles for isolated stack diagnosis
        if: endsWith(github.ref_name, '-stack-diagnostic')
        uses: actions/download-artifact@v6
        with:
          name: release-arm64-msvc-pgo-1-evidence
          path: ${{ env.MATCHED_ROOT }}/p
          run-id: 38172717639
          github-token: ${{ github.token }}
      - name: Build and qualify the selected experiment
        run: |
          $hostTriple = if ('${{ matrix.arch }}' -eq 'arm64') { 'aarch64-pc-windows-msvc' } else { 'x86_64-pc-windows-msvc' }
          $script = 'harness\.github\scripts\matched_release.py'
          $extra = @()
          if ('${{ endsWith(github.ref_name, '-stack-diagnostic') }}' -eq 'true') {
            $script = 'harness\.github\scripts\matched_release_stack.py'
            $extra = @('--profiles', "$env:MATCHED_ROOT\p")
            if ('${{ endsWith(github.ref_name, '-repair-stack-diagnostic') }}' -eq 'true') {
              $extra += '--test-source-repair'
            }
          }
          harness\.github\scripts\invoke_msvc_experiment.ps1 -Architecture ${{ matrix.arch }} -Script $script --source "$env:MATCHED_ROOT\r" --runtime-source "$env:MATCHED_ROOT\l" --output "$env:MATCHED_ROOT\e" --host $hostTriple --variant ${{ matrix.variant }} @extra
      - name: Preserve diagnostics even on failure
        uses: actions/upload-artifact@v6
        if: always() && env.MATCHED_ROOT != ''
        with:
          name: release-${{ matrix.arch }}-${{ matrix.variant }}-${{ matrix.vm }}-evidence
          path: |
            ${{ env.MATCHED_ROOT }}/e/*.json
            ${{ env.MATCHED_ROOT }}/e/*.stdout
            ${{ env.MATCHED_ROOT }}/e/*.stderr
            ${{ env.MATCHED_ROOT }}/e/*.txt
            ${{ env.MATCHED_ROOT }}/e/*.toml
            ${{ env.MATCHED_ROOT }}/e/*.cmake
            ${{ env.MATCHED_ROOT }}/r/build/metrics.json
            ${{ env.MATCHED_ROOT }}/r/opt-artifacts/*.profdata
          compression-level: 1
          retention-days: 30
      - name: Retain actual full distribution
        uses: actions/upload-artifact@v6
        if: success() && !endsWith(github.ref_name, '-stack-diagnostic')
        with:
          name: release-${{ matrix.arch }}-${{ matrix.variant }}-${{ matrix.vm }}-dist
          path: ${{ env.MATCHED_ROOT }}/r/build/dist
          compression-level: 0
          retention-days: 7
      - name: Preserve diagnostic compiler including symbols
        uses: actions/upload-artifact@v6
        if: always() && endsWith(github.ref_name, '-stack-diagnostic')
        with:
          name: stack-diagnostic-arm64-compiler
          path: ${{ env.MATCHED_ROOT }}/e/diagnostic-compiler.zip
          compression-level: 0
          retention-days: 7
      - name: Preserve unqualified distribution files for diagnosis
        uses: actions/upload-artifact@v6
        if: failure() && env.MATCHED_ROOT != '' && !endsWith(github.ref_name, '-stack-diagnostic')
        with:
          name: release-${{ matrix.arch }}-${{ matrix.variant }}-${{ matrix.vm }}-unqualified-dist
          path: ${{ env.MATCHED_ROOT }}/r/build/dist
          compression-level: 0
          retention-days: 7
