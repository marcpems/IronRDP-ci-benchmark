name: Rust compiler CPU validation

on:
  push:
    branches: [ci/compiler-validation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler:
    if: github.repository != 'Devolutions/IronRDP'
    name: ${{ matrix.platform }} / replicate ${{ matrix.replicate }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        replicate: [1, 2, 3]
        platform: [linux-x64, windows-x64, linux-arm64, windows-arm64]
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            host: x86_64-unknown-linux-gnu
            python-arch: x64
          - platform: windows-x64
            runner: windows-2025
            host: x86_64-pc-windows-msvc
            python-arch: x64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            host: aarch64-unknown-linux-gnu
            python-arch: arm64
          - platform: windows-arm64
            runner: windows-11-arm
            host: aarch64-pc-windows-msvc
            python-arch: arm64
    env:
      BENCHMARK_HOST: ${{ matrix.host }}
      BENCHMARK_PLATFORM: ${{ matrix.platform }}
      BENCHMARK_REPLICATE: ${{ matrix.replicate }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python-arch }}
      - name: Install pinned native Rust
        shell: pwsh
        run: |
          $channel = python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('rust-toolchain.toml').read_text())['toolchain']['channel'])"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read Rust toolchain' }
          $toolchain = "$channel-${{ matrix.host }}"
          rustup toolchain install $toolchain --profile minimal --target wasm32-unknown-unknown
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          "RUSTUP_TOOLCHAIN=$toolchain" >> $env:GITHUB_ENV
      - name: Fetch sources outside measurements
        shell: pwsh
        run: |
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { throw 'Dependency fetch failed' }
      - name: Build native compiler meter
        shell: pwsh
        run: |
          $meter = Join-Path $env:RUNNER_TEMP 'rustc-metrics'
          if ($IsWindows) { $meter += '.exe' }
          rustc .github/scripts/rustc_metrics.rs --edition=2024 -O -o $meter
          if ($LASTEXITCODE -ne 0) { throw 'Compiler meter build failed' }
          "COMPILER_METER=$meter" >> $env:GITHUB_ENV
      - name: Validate measurement suite
        shell: pwsh
        run: |
          python -m unittest discover -s .github/scripts -p test_compiler_probe.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Measurement suite validation failed' }
      - name: Measure one and four CPU compilation
        shell: pwsh
        run: |
          python .github/scripts/compiler_probe.py --source . --output compiler-results --wrapper "$env:COMPILER_METER"
          if ($LASTEXITCODE -ne 0) { throw 'Compiler validation failed; inspect evidence' }
      - name: Verify lockfile outside measurements
        shell: pwsh
        run: |
          git diff --exit-code -- Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw 'Lockfile changed' }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: compiler-${{ matrix.platform }}-${{ matrix.replicate }}
          path: compiler-results
          if-no-files-found: warn
          retention-days: 30
