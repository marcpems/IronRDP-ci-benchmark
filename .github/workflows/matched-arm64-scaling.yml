name: Ordinary Arm64 MSVC PGO Rust ThinLTO scaling replacement
on:
  push:
    branches: [experiment/msvc-rust-thin-scaling-arm64]
permissions:
  contents: read
jobs:
  arm64-16:
    uses: ./.github/workflows/matched-scaling-cell.yml
    with:
      machine: arm64
      cores: 16
  arm64-4:
    needs: arm64-16
    uses: ./.github/workflows/matched-scaling-cell.yml
    with:
      machine: arm64
      cores: 4
