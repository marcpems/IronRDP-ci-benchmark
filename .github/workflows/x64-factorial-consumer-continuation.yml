name: x64 factorial ThinLTO frozen consumer continuation
on:
  workflow_dispatch:
  push:
    branches: [experiment/x64-factorial-consumers]
permissions:
  contents: read
  actions: read
concurrency:
  # Keep the earlier surviving VM as diagnostic evidence; retry a complete matched matrix.
  group: x64-factorial-consumer-native-probe
  cancel-in-progress: false
defaults:
  run:
    shell: pwsh
env:
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  consumer:
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        vm: [1, 2, 3, 4]
    steps:
      - name: Require independent matching hosted allocation
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_ARCH -ne 'X64') { throw 'Hosted X64 only' }
          if ($env:ImageVersion -ne '20261026.347.1') { throw 'Producer image differs; refusing silently changed inputs' }
          if (Test-Path D:\ri) { throw 'Consumer path already exists' }
          New-Item -ItemType Directory D:\ri\e | Out-Null
          @{
            Runner=$env:RUNNER_NAME; Image=$env:ImageVersion
            Cpu=@(Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors)
            System=Get-CimInstance Win32_ComputerSystem | Select-Object NumberOfLogicalProcessors,TotalPhysicalMemory
          } | ConvertTo-Json -Depth 6 | Set-Content D:\ri\e\hardware.json
      - uses: actions/checkout@v6
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: marcpems/IronRDP-ci-benchmark
          ref: 0c5419eca6bf53563056ed252f537bca67862705
          path: workload
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: x64
      - name: Check continuation harness
        run: python -m unittest discover -s harness\.github\scripts -p "test_x64*thin*.py"
      - name: Download three original untouched packages
        uses: actions/download-artifact@v6
        with:
          github-token: ${{ github.token }}
          run-id: 41116552933
          pattern: factorial-*-package
          path: D:\ri\artifacts
      - name: Download only the recovered fourth package
        uses: actions/download-artifact@v6
        with:
          github-token: ${{ github.token }}
          run-id: 41295055576
          name: factorial-both-thin-package
          path: D:\ri\artifacts\factorial-both-thin-package
      - name: Restore manifests and pinned native tools
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($arm in @('baseline','rust-thin','llvm-thin','both-thin')) {
            Move-Item "D:\ri\artifacts\factorial-$arm-package\e\result.json" "D:\ri\artifacts\factorial-$arm-package\result.json"
          }
          [IO.Directory]::Move((Resolve-Path workload).Path, 'D:\ri\workload')
          curl.exe --fail --location --retry 3 https://ci-mirrors.rust-lang.org/rustc/LLVM-20.1.3-win64.exe -o D:\ri\LLVM-20.1.3-win64.exe
          if ($LASTEXITCODE) { throw 'Clang download failed' }
          if ((Get-FileHash D:\ri\LLVM-20.1.3-win64.exe).Hash.ToLowerInvariant() -ne '0a18ea761147a7de69d6dd60ef81b70496e5255aec6caff22d45da85188614af') { throw 'Clang checksum mismatch' }
          7z x -y -bd -bso0 -oD:\ri\clang D:\ri\LLVM-20.1.3-win64.exe
          if ($LASTEXITCODE) { throw 'Clang extraction failed' }
      - name: Verify frozen producers, prove drivers and measure unchanged balanced blocks
        timeout-minutes: 330
        run: |
          harness\.github\scripts\invoke_msvc_experiment.ps1 -Architecture x64 -Script harness\.github\scripts\x64_factorial_thin.py benchmark --root D:\ri --source D:\ri\workload --vm ${{ matrix.vm }} --continuation harness\ci-benchmark\x64-factorial-continuation.json
      - name: Preserve complete or failed consumer receipts
        if: always()
        uses: actions/upload-artifact@v6
        timeout-minutes: 15
        with:
          name: factorial-consumer-${{ matrix.vm }}
          path: |
            D:\ri\e\*.json
            D:\ri\e\*.stdout
            D:\ri\e\*.stderr
            D:\ri\e\identity-*\*.json
            D:\ri\e\identity-*\*.stdout
            D:\ri\e\identity-*\*.stderr
            D:\ri\e\correctness-*\*.json
            D:\ri\e\correctness-*\*.stdout
            D:\ri\e\correctness-*\*.stderr
            D:\ri\e\round-*\*.json
            D:\ri\e\round-*\*.stdout
            D:\ri\e\round-*\*.stderr
            D:\ri\e\round-*\*.timings.html
            D:\ri\e\meter-validation\*.json
            D:\ri\e\meter-validation\*.stdout
            D:\ri\e\meter-validation\*.stderr
          retention-days: 30
          compression-level: 1
  analyze:
    needs: consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v6
        with:
          pattern: factorial-consumer-*
          path: evidence
      - uses: actions/download-artifact@v6
        with:
          github-token: ${{ github.token }}
          run-id: 41116552933
          name: factorial-baseline-evidence
          path: evidence/factorial-baseline-evidence
      - uses: actions/download-artifact@v6
        with:
          github-token: ${{ github.token }}
          run-id: 41116552933
          name: factorial-rust-thin-evidence
          path: evidence/factorial-rust-thin-evidence
      - uses: actions/download-artifact@v6
        with:
          github-token: ${{ github.token }}
          run-id: 41116552933
          name: factorial-llvm-thin-evidence
          path: evidence/factorial-llvm-thin-evidence
      - uses: actions/download-artifact@v6
        with:
          github-token: ${{ github.token }}
          run-id: 41295055576
          name: factorial-both-thin-evidence
          path: evidence/factorial-both-thin-evidence
      - name: Verify raw receipts and calculate paired factorial contrasts
        run: |
          python .github/scripts/verify_x64_factorial_thin.py --artifacts evidence \
            --run-id "$GITHUB_RUN_ID" --head "$GITHUB_SHA" --attempt "$GITHUB_RUN_ATTEMPT" \
            --continuation ci-benchmark/x64-factorial-continuation.json \
            --output factorial-results.json
      - uses: actions/upload-artifact@v6
        with:
          name: factorial-verified-summary
          path: factorial-results.json
          retention-days: 30
          if-no-files-found: error
