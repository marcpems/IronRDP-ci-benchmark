name: Bounded retained x64 training-profile replay
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pgo-locality-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'marcpems/IronRDP-ci-benchmark'
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: x64-profile-official-compiler
          run-id: 39771158637
          github-token: ${{ github.token }}
          path: downloaded-compilers/official
      - uses: actions/download-artifact@v4
        with:
          name: x64-profile-repaired-compiler
          run-id: 39771158637
          github-token: ${{ github.token }}
          path: downloaded-compilers/repaired
      - name: Retained same-source compiler pair and sequential traces
        shell: pwsh
        run: python .github/scripts/x64_profile_locality.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retained-x64-profile-locality
          path: profile-locality-evidence
          retention-days: 7
