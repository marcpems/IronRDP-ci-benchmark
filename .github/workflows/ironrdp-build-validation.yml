name: IronRDP build scenario validation

on:
  workflow_dispatch:
  push:
    branches:
      - perf/ironrdp-build

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            architecture: x64
          - runner: windows-11-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scenario regressions
        run: |
          python -B -m unittest discover -s scenarios\windows\ironrdp_build\tests -p test_ironrdp_build.py -v
          if ($LASTEXITCODE -ne 0) { throw ' ERROR - Python regressions failed.' }
          & .\scenarios\windows\ironrdp_build\tests\test_ironrdp_scripts.ps1
      - name: Install missing x64 assembler on the disposable runner
        if: matrix.architecture == 'x64'
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw ' ERROR - NASM installation failed.' }
            Join-Path $env:ProgramFiles 'NASM' | Add-Content $env:GITHUB_PATH
          }
      - name: Validate real builds, failure, cancellation and repeat teardown
        run: |
          & .\scenarios\windows\ironrdp_build\tests\validate_ironrdp_build.ps1 `
            -workRoot "$env:RUNNER_TEMP\ironrdp-validation\work" `
            -dataDirectory "$env:RUNNER_TEMP\ironrdp-validation\data"
      - name: Preserve scenario diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ironrdp-build-${{ matrix.architecture }}
          path: ${{ runner.temp }}\ironrdp-validation\data
          if-no-files-found: warn
          retention-days: 14
