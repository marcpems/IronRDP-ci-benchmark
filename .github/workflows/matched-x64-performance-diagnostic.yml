name: Diagnose x64 CPU scaling and storage without changing system settings
on:
  push:
    branches: [experiment/matched-x64-performance-diagnostic]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == 'marcpems/IronRDP-ci-benchmark'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    concurrency:
      group: matched-x64-selfhost
      cancel-in-progress: false
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Require idle experiment runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'MARCPE-TEST01-X64') { throw 'Unexpected diagnostic runner' }
          $processes = @(Get-CimInstance Win32_Process)
          $ancestors = @()
          $cursor = $PID
          while ($cursor -ne 0 -and $cursor -notin $ancestors) {
            $ancestors += $cursor
            $parent = $processes | Where-Object ProcessId -eq $cursor
            if (!$parent) { break }
            $cursor = $parent.ParentProcessId
          }
          $blockers = @($processes | Where-Object {
            $_.ProcessId -notin $ancestors -and
            ($_.Name -in @('Runner.Worker.exe','cmake.exe','ninja.exe','clang-cl.exe','cl.exe','link.exe',
                          'rustc.exe','rustdoc.exe','cargo.exe','opt-dist.exe','bootstrap.exe') -or
             ($_.Name -eq 'python.exe' -and $_.CommandLine -match 'matched_release\.py|build_arm_compilers\.py|m\d{8}(?:[bml]\d+|t\d+r\d+)'))
          })
          if ($blockers.Count) {
            $blockers | Select-Object Name,ProcessId,ParentProcessId | ConvertTo-Json
            throw 'Concurrent experiment work detected; no diagnostics started and no process killed'
          }
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: x64
      - name: Sample system state and calibrate four versus sixteen CPUs and C versus E
        shell: powershell
        run: |
          python .github\scripts\x64_runner_diagnostic.py --compiler-probe --output "$env:RUNNER_TEMP\x64-performance-$env:GITHUB_RUN_ID"
          if ($LASTEXITCODE) { throw 'X64 performance diagnostics failed; partial evidence retained' }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: x64-performance-diagnostic
          path: ${{ runner.temp }}/x64-performance-${{ github.run_id }}
          retention-days: 30
