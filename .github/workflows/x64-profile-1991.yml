name: Revalidate repaired LLVM PGO on Rust 1.99.1
on:
  push:
    branches: [experiment/x64-pgo-1991]
permissions:
  contents: read
  actions: read
concurrency:
  group: matched-x64-selfhost
  cancel-in-progress: false
jobs:
  train:
    if: github.repository == 'marcpems/IronRDP-ci-benchmark'
    uses: ./.github/workflows/x64-profile-1991-cell.yml
    with:
      phase: train
  official:
    needs: train
    uses: ./.github/workflows/x64-profile-1991-cell.yml
    with:
      phase: official
  repaired:
    needs: official
    uses: ./.github/workflows/x64-profile-1991-cell.yml
    with:
      phase: repaired
  replay:
    needs: repaired
    uses: ./.github/workflows/x64-profile-replay-cell.yml
    with:
      compiler_artifacts: true
      protocol_from_artifact: true
