name: Diagnose self-hosted runner connectivity without changing machine settings
on:
  push:
    branches: [experiment/matched-x64-runner-diagnostics, experiment/matched-gb300-runner-diagnostics]
permissions:
  contents: read
concurrency:
  group: ${{ github.ref_name == 'experiment/matched-gb300-runner-diagnostics' && 'matched-highcore-arm64-selfhost' || 'matched-x64-selfhost' }}
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.repository == 'marcpems/IronRDP-ci-benchmark'
    runs-on: ${{ fromJSON(github.ref_name == 'experiment/matched-gb300-runner-diagnostics' && '["self-hosted","Windows","ARM64","HighCoreCount"]' || '["self-hosted","Windows","X64"]') }}
    timeout-minutes: 15
    env:
      EXPECTED_RUNNER: ${{ github.ref_name == 'experiment/matched-gb300-runner-diagnostics' && 'GB300-Arm64' || 'MARCPE-TEST01-X64' }}
    steps:
      - name: Require the exact diagnostic runner
        shell: powershell
        run: |
          if ($env:RUNNER_NAME -ne $env:EXPECTED_RUNNER) { throw 'Unexpected diagnostic runner' }
      - name: Preserve the existing GB300 relocation receipt before connectivity probes
        if: env.EXPECTED_RUNNER == 'GB300-Arm64'
        uses: actions/upload-artifact@v6
        with:
          name: gb300-existing-preservation-receipt
          path: C:\matched-retained\m03042998t32r1-39092612711\relocation.json
          retention-days: 30
          if-no-files-found: error
      - name: Inspect sanitized runner events and HTTPS connectivity
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne $env:EXPECTED_RUNNER) { throw 'Unexpected diagnostic runner' }
          $root = if ($env:EXPECTED_RUNNER -eq 'GB300-Arm64') { 'D:\action-runners' } else { 'E:\actions-runner' }
          $os = Get-CimInstance Win32_OperatingSystem
          @{Kind='boot'; LastBootUTC=$os.LastBootUpTime.ToUniversalTime().ToString('o');
            FreeMemoryKiB=$os.FreePhysicalMemory} | ConvertTo-Json -Compress
          & powercfg /getactivescheme
          if ($LASTEXITCODE) { throw 'Cannot read active power scheme' }
          & powercfg /query SCHEME_CURRENT SUB_SLEEP STANDBYIDLE
          if ($LASTEXITCODE) { throw 'Cannot read configured idle sleep timeout' }
          @(Get-CimInstance Win32_LogicalDisk | Where-Object DeviceID -in @('C:','D:','E:') |
            Select-Object DeviceID,FileSystem,Size,FreeSpace) | ConvertTo-Json -Compress
          foreach ($query in @(
            @{ProviderName='Microsoft-Windows-Kernel-Power'; Id=@(41,42,107,109)},
            @{ProviderName='Microsoft-Windows-Power-Troubleshooter'; Id=@(1)},
            @{ProviderName='Microsoft-Windows-Kernel-General'; Id=@(1)},
            @{ProviderName='disk'; Id=@(7,51,153)}
          )) {
            try {
              $events = @(Get-WinEvent -FilterHashtable @{
                LogName='System'; ProviderName=$query.ProviderName; Id=$query.Id
                StartTime=[datetime]::Now.AddDays(-2)
              } -MaxEvents 100 | Select-Object Id,@{Name='UTC';Expression={$_.TimeCreated.ToUniversalTime().ToString('o')}})
              @{Kind='system-events'; Provider=$query.ProviderName; Events=$events} | ConvertTo-Json -Depth 4 -Compress
            } catch {
              @{Kind='system-events'; Provider=$query.ProviderName;
                NoMatchingEvents=($_.FullyQualifiedErrorId -like 'NoMatchingEventsFound*');
                ErrorId=$_.FullyQualifiedErrorId} | ConvertTo-Json -Compress
            }
          }
          & "$root\bin\Runner.Listener.exe" --version
          if ($LASTEXITCODE) { throw 'Cannot identify installed runner version' }
          @{Kind='clock'; Utc=[DateTime]::UtcNow.ToString('o')} | ConvertTo-Json -Compress
          $services = @(Get-CimInstance Win32_Service | Where-Object Name -Like 'actions.runner.*' |
            Select-Object Name,State,StartMode)
          @{Kind='runner-services'; Count=$services.Count; Services=$services} | ConvertTo-Json -Depth 4 -Compress
          foreach ($name in @('HTTP_PROXY','HTTPS_PROXY','ALL_PROXY','NO_PROXY')) {
            @{Kind='proxy-environment'; Name=$name; Present=![string]::IsNullOrEmpty([Environment]::GetEnvironmentVariable($name))} |
              ConvertTo-Json -Compress
          }
          foreach ($name in @('GITHUB_ACTIONS_RUNNER_HTTP_TIMEOUT','GITHUB_ACTIONS_RUNNER_HTTP_RETRY')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value -and $value -notmatch '^\d+$') { throw "Unexpected numeric runner setting: $name" }
            @{Kind='runner-http-setting'; Name=$name; Value=$value} | ConvertTo-Json -Compress
          }
          $hosts = [System.Collections.Generic.HashSet[string]]::new()
          [void]$hosts.Add('github.com')
          [void]$hosts.Add('api.github.com')
          $hours = if ($env:EXPECTED_RUNNER -eq 'GB300-Arm64') { 48 } else { 8 }
          $logs = @(Get-ChildItem -LiteralPath "$root\_diag" -Filter 'Runner_*.log' -File |
            Where-Object LastWriteTimeUtc -GT ([DateTime]::UtcNow.AddHours(-$hours)) |
            Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 120 |
            Sort-Object LastWriteTimeUtc)
          if (!$logs.Count) { throw 'No recent listener diagnostic logs found' }
          $patterns = [ordered]@{
            'http-timeout' = 'HTTP request timed out'
            'request-timeout-exception' = 'TimeoutException'
            'transport-error' = 'HttpRequestException|SocketException|SSL connection could not|remote certificate is invalid'
            'dns-error' = 'No such host|name.*could not be resolved'
            'dispatcher-shutdown' = 'Shutting down JobDispatcher|cancel any running job'
            'job-cancel' = 'Sending job cancellation|Cancel message|Job cancellation|Cancel running job'
            'job-renewal-error' = '(?i)(fail|error).*(renew|lease)|(renew|lease).*(fail|error)'
            'listener-retry' = 'retryable|Runner listener exit|Retrying'
          }
          foreach ($log in $logs) {
            $events = [System.Collections.Generic.List[object]]::new()
            $stamp = ''
            foreach ($line in Get-Content -LiteralPath $log.FullName) {
              if ($line -match '^\[([0-9TZ:. -]+) (INFO|WARN|ERR|VERB)') { $stamp=$Matches[1] }
              foreach ($match in [regex]::Matches($line, 'https://([a-zA-Z0-9.-]+)')) {
                $hostName = $match.Groups[1].Value.ToLowerInvariant()
                if ($hostName -match '(^|\.)github\.com$|(^|\.)actions\.githubusercontent\.com$') {
                  [void]$hosts.Add($hostName)
                }
              }
              foreach ($event in $patterns.Keys) {
                if ($line -match $patterns[$event]) {
                  $events.Add(@{Time=$stamp; Event=$event})
                }
              }
              if ($line -match '^\s*at (GitHub\.(Runner|DistributedTask|Actions|Services)\.[A-Za-z0-9_.<>]+)\(') {
                $events.Add(@{Time=$stamp; Event='stack-method'; Method=$Matches[1]})
              }
            }
            if ($events.Count) {
              $counts = @{}
              foreach ($event in $events) { $counts[$event.Event] = 1 + [int]$counts[$event.Event] }
              @{Kind='listener-events'; File=$log.Name; Counts=$counts; Events=@($events | Select-Object -Last 18)} |
                ConvertTo-Json -Depth 5 -Compress
            }
          }
          $targets = @($hosts | Sort-Object | Select-Object -First 8)
          foreach ($target in $targets) {
            $uri = [Uri]"https://$target/"
            $proxy = [System.Net.WebRequest]::GetSystemWebProxy()
            @{Kind='system-proxy-route'; Hostname=$target; Bypassed=$proxy.IsBypassed($uri)} | ConvertTo-Json -Compress
            try {
              $addresses = [System.Net.Dns]::GetHostAddresses($target)
              @{Kind='dns'; Hostname=$target; AddressCount=$addresses.Count; Success=($addresses.Count -gt 0)} |
                ConvertTo-Json -Compress
            } catch {
              @{Kind='dns'; Hostname=$target; Success=$false; ErrorType=$_.Exception.GetType().FullName} |
                ConvertTo-Json -Compress
            }
            foreach ($round in 1..3) {
              $timer = [System.Diagnostics.Stopwatch]::StartNew()
              $request = [System.Net.HttpWebRequest]::Create($uri)
              $request.Method = 'HEAD'
              $request.Timeout = 20000
              $request.ReadWriteTimeout = 20000
              $request.AllowAutoRedirect = $false
              $request.UserAgent = 'matched-runner-connectivity-diagnostic'
              $response = $null
              try {
                $response = $request.GetResponse()
                @{Kind='https'; Hostname=$target; Round=$round; Status=[int]$response.StatusCode; Seconds=$timer.Elapsed.TotalSeconds; TransportSuccess=$true} |
                  ConvertTo-Json -Compress
              } catch [System.Net.WebException] {
                $response = $_.Exception.Response
                @{Kind='https'; Hostname=$target; Round=$round; Seconds=$timer.Elapsed.TotalSeconds;
                  TransportSuccess=($null -ne $response); WebStatus=$_.Exception.Status.ToString();
                  Status=$(if ($response) { [int]$response.StatusCode } else { $null })} |
                  ConvertTo-Json -Compress
              } finally {
                if ($response) { $response.Close() }
                $request.Abort()
              }
            }
          }
