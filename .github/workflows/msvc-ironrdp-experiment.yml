name: Measure same-tools Windows compilers on IronRDP
on:
  push:
    branches: [experiment/windows-msvc-pilot, experiment/windows-msvc-full, experiment/windows-msvc-x64-pilot, experiment/windows-msvc-x64-full, experiment/windows-msvc-arm64-pilot, experiment/windows-msvc-arm64-full]
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful same-tools compiler build workflow run ID
        required: true
        type: string
      pilot:
        description: One VM and one round per architecture before the full study
        type: boolean
        default: true
      architecture:
        description: Architecture scope
        type: choice
        options: [both, x64, arm64]
        default: both
permissions:
  contents: read
  actions: read
env:
  COMPILER_BUILD_RUN: ${{ inputs.build_run || (startsWith(github.ref_name, 'experiment/windows-msvc-arm64-') && '38056115559' || '38021536352') }}
jobs:
  measure:
    if: github.repository == 'marcpems/IronRDP-ci-benchmark'
    name: ${{ matrix.arch }} / VM ${{ matrix.vm }}
    runs-on: ${{ matrix.arch == 'x64' && 'windows-2025' || 'windows-11-arm' }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON((inputs.architecture == 'x64' || startsWith(github.ref_name, 'experiment/windows-msvc-x64-')) && '["x64"]' || (inputs.architecture == 'arm64' || startsWith(github.ref_name, 'experiment/windows-msvc-arm64-')) && '["arm64"]' || '["x64","arm64"]') }}
        vm: ${{ fromJSON((inputs.pilot || endsWith(github.ref_name, '-pilot')) && '[1]' || '[1,2,3,4,5]') }}
    env:
      BENCHMARK_HOST: ${{ matrix.arch == 'x64' && 'x86_64-pc-windows-msvc' || 'aarch64-pc-windows-msvc' }}
      BENCHMARK_PLATFORM: windows-${{ matrix.arch }}
      BENCHMARK_REPLICATE: ${{ matrix.vm }}
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_BUILD_JOBS: "4"
      VSCMD_SKIP_SENDTELEMETRY: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: Devolutions/IronRDP
          ref: 0c5419eca6bf53563056ed252f537bca67862705
          path: workload
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: ${{ matrix.arch }}
      - uses: ./.github/actions/install-build-deps
      - uses: actions/download-artifact@v6
        with:
          name: msvc-${{ matrix.arch }}-baseline
          path: compilers/baseline
          run-id: ${{ env.COMPILER_BUILD_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v6
        with:
          name: msvc-${{ matrix.arch }}-pgo
          path: compilers/pgo
          run-id: ${{ env.COMPILER_BUILD_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v6
        with:
          name: msvc-${{ matrix.arch }}-pgo-rust-thin
          path: compilers/pgo-rust-thin
          run-id: ${{ env.COMPILER_BUILD_RUN }}
          github-token: ${{ github.token }}
      - name: Prepare identical native support tools
        shell: pwsh
        run: |
          $suffix = if ('${{ matrix.arch }}' -eq 'arm64') { 'woa64' } else { 'win64' }
          New-Item -ItemType Directory -Path tools -Force | Out-Null
          curl.exe --fail --location --retry 3 "https://ci-mirrors.rust-lang.org/rustc/LLVM-22.1.8-$suffix.exe" -o tools\clang-installer.exe
          if ($LASTEXITCODE) { throw 'Clang download failed' }
          7z x -y -bd -bso0 -otools\clang tools\clang-installer.exe
          if ($LASTEXITCODE) { throw 'Clang extraction failed' }
          $key = 'HKLM:\Software\Policies\Microsoft\VisualStudio\SQM'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name OptIn -PropertyType DWord -Value 0 -Force | Out-Null
      - name: Replay offline native builds and original tests
        shell: pwsh
        run: |
          $extra = @()
          if ('${{ inputs.pilot }}' -eq 'true' -or '${{ endsWith(github.ref_name, '-pilot') }}' -eq 'true') { $extra += '--pilot' }
          .github\scripts\invoke_msvc_experiment.ps1 -Architecture ${{ matrix.arch }} -Script .github\scripts\msvc_ironrdp_probe.py --source workload --compilers compilers --output results --clang tools\clang\bin --build-run "$env:COMPILER_BUILD_RUN" --protocol ci-benchmark\msvc-linker\protocol.json @extra
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: msvc-ironrdp-${{ matrix.arch }}-${{ matrix.vm }}
          path: results
          if-no-files-found: error
          retention-days: 30
