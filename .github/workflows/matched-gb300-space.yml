name: Inspect matched runner experiment disk usage
on:
  push:
    branches: [experiment/matched-gb300-space]
  workflow_call:
    inputs:
      machine:
        type: string
        default: gb300
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'marcpems/IronRDP-ci-benchmark'
    runs-on: ${{ fromJSON(inputs.machine == 'arm64' && '["self-hosted","Windows","ARM64","MatchedStandardArm64"]' || '["self-hosted","Windows","ARM64","HighCoreCount"]') }}
    timeout-minutes: 30
    concurrency:
      group: ${{ inputs.machine == 'arm64' && 'matched-arm64-selfhost' || 'matched-highcore-arm64-selfhost' }}
      cancel-in-progress: false
    env:
      INVENTORY_RUNNER: ${{ inputs.machine == 'arm64' && 'MARCPE-D4-Arm64' || 'GB300-Arm64' }}
      INVENTORY_NAME: ${{ inputs.machine == 'arm64' && 'arm64-space-inventory' || 'gb300-space-inventory' }}
    steps:
      - name: Check for surviving work after the runner restart
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne $env:INVENTORY_RUNNER) { throw 'Unexpected inventory runner' }
          $processes = @(Get-CimInstance Win32_Process)
          $ancestors = @()
          $cursor = $PID
          while ($cursor -ne 0 -and $cursor -notin $ancestors) {
            $ancestors += $cursor
            $parent = $processes | Where-Object ProcessId -eq $cursor
            if (!$parent) { break }
            $cursor = $parent.ParentProcessId
          }
          $blockers = @($processes | Where-Object {
            $_.ProcessId -notin $ancestors -and
            ($_.Name -in @('Runner.Worker.exe','cmake.exe','ninja.exe',
                          'clang-cl.exe','cl.exe','link.exe','rustc.exe','rustdoc.exe',
                          'cargo.exe','opt-dist.exe','bootstrap.exe') -or
             ($_.Name -eq 'python.exe' -and $_.CommandLine -match 'matched_release\.py|build_arm_compilers\.py|m\d{8}(?:[bml]\d+|t\d+r\d+)|\s-\s*$'))
          })
          $blockers | ForEach-Object {
            $process = $_
            @{
              Name=$process.Name; ProcessId=$process.ProcessId; ParentProcessId=$process.ParentProcessId
              CreatedUTC=$process.CreationDate.ToUniversalTime().ToString('o')
              ExecutablePath=$process.ExecutablePath
              ScriptNames=@([regex]::Matches($process.CommandLine, '[\w.-]+\.py\b') | ForEach-Object Value)
              Modules=@([regex]::Matches($process.CommandLine, '(?<=-m )[\w.]+') | ForEach-Object Value)
              ExperimentRoots=@([regex]::Matches($process.CommandLine, 'm\d{8}(?:[bml]\d+|t\d+r\d+)') | ForEach-Object Value)
              ParentName=($processes | Where-Object ProcessId -eq $process.ParentProcessId | Select-Object -ExpandProperty Name)
              KernelTime=$process.KernelModeTime; UserTime=$process.UserModeTime
              ReadBytes=$process.ReadTransferCount; WriteBytes=$process.WriteTransferCount
            }
          } | ConvertTo-Json -Depth 5
          if ($blockers.Count) { throw 'Surviving work detected; no processes killed' }
      - uses: actions/setup-python@v6
        if: always()
        with:
          python-version: "3.13"
          architecture: arm64
      - name: Inventory experiment directories without following redirected entries
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne $env:INVENTORY_RUNNER) { throw 'Unexpected inventory runner' }
          @'
          import json, os, re, shutil, stat, time
          from pathlib import Path
          report = {"volumes": {d: dict(zip(("total", "used", "free"), shutil.disk_usage(d)))
                                for d in ("C:\\", "D:\\")}, "roots": []}
          def redirected(path):
              return bool(path.lstat().st_file_attributes & stat.FILE_ATTRIBUTE_REPARSE_POINT)
          def bounded_usage(path):
              pending = [path]
              size = count = skipped = 0
              deadline = time.monotonic() + 45
              while pending:
                  with os.scandir(pending.pop()) as entries:
                      for entry in entries:
                          if time.monotonic() >= deadline:
                              return {"path": str(path), "bytes_lower_bound": size,
                                      "files": count, "complete": False, "skipped_links": skipped}
                          info = entry.stat(follow_symlinks=False)
                          if info.st_file_attributes & stat.FILE_ATTRIBUTE_REPARSE_POINT:
                              skipped += 1
                          elif stat.S_ISDIR(info.st_mode):
                              pending.append(entry.path)
                          elif stat.S_ISREG(info.st_mode):
                              count += 1
                              size += info.st_size
                          else:
                              raise RuntimeError(f"Unknown filesystem entry: {entry.path}")
              return {"path": str(path), "bytes": size, "files": count,
                      "complete": True, "skipped_links": skipped}
          output = Path(os.environ["RUNNER_TEMP"]) / f"{os.environ['INVENTORY_NAME']}.json"
          output.write_text(json.dumps(report, indent=2), encoding="utf-8")
          print(json.dumps(report["volumes"]), flush=True)
          for root in sorted(Path("D:\\").iterdir()):
              if not re.fullmatch(r"(?:m\d{8}(?:[bml]\d+|t\d+r\d+)|v(?:47351434|47985162))", root.name):
                  continue
              if redirected(root) or not root.is_dir():
                  raise RuntimeError(f"Unexpected experiment root: {root}")
              row = {"path": str(root), "metadata": {}, "usage": []}
              for part in ("e", "r"):
                  if (root / part).exists() and redirected(root / part):
                      raise RuntimeError(f"Redirected experiment metadata/source: {root / part}")
              for name in ("provenance", "result", "active-stage", "space-recovery"):
                  path = root / "e" / f"{name}.json"
                  if path.is_file():
                      data = json.loads(path.read_text(encoding="utf-8-sig"))
                      row["metadata"][name] = {key: data[key] for key in (
                          "run_id", "runner_name", "runner_class", "variant", "complete",
                          "full_distribution", "rust_sha", "vm", "attempt", "build_jobs",
                          "build_affinity_count", "stage", "retained_distribution")
                          if key in data}
              parts = {root / relative for relative in (
                  "r", "r/build", "r/opt-artifacts", "e", "e/cargo-home", "retained-dist")}
              for parent in (root, root / "e", root / "r/opt-artifacts"):
                  if parent.is_dir():
                      if redirected(parent):
                          raise RuntimeError(f"Redirected inventory parent: {parent}")
                      parts.update(child for child in parent.iterdir() if child.is_dir())
              for path in sorted(parts):
                  if path.exists():
                      if redirected(path):
                          row["usage"].append({"path": str(path), "redirected": True, "not_scanned": True})
                          continue
                      row["usage"].append(bounded_usage(path))
              report["roots"].append(row)
              output.write_text(json.dumps(report, indent=2), encoding="utf-8")
              print(json.dumps(row), flush=True)
          '@ | python -
          if ($LASTEXITCODE) { throw 'Matched runner inventory failed' }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ env.INVENTORY_NAME }}
          path: ${{ runner.temp }}/${{ env.INVENTORY_NAME }}.json
          retention-days: 30
