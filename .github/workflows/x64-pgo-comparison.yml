name: Qualify x64 upstream versus local PGO comparison
on:
  push:
    branches: [experiment/x64-pgo-comparison, experiment/x64-pgo-comparison-pilot, experiment/x64-pgo-checkout-diagnostic]
  workflow_dispatch:
    inputs:
      run_releases:
        description: Run the sequential full-release pilot after readiness checks
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: matched-x64-selfhost
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'marcpems/IronRDP-ci-benchmark'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Inspect runner CPU, storage and idle state without changing settings
        shell: powershell
        run: |
          .github\scripts\x64_pgo_preflight.ps1 -Output "$env:RUNNER_TEMP\x64-pgo-preflight-$env:GITHUB_RUN_ID.json"
      - name: Preserve readiness evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: x64-pgo-preflight
          path: ${{ runner.temp }}/x64-pgo-preflight-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Diagnose the exact failed LLVM checkout without modifying it
        if: github.ref_name == 'experiment/x64-pgo-checkout-diagnostic'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\q48837696u'
          if ((Get-Content -LiteralPath "$root\owner-run.txt").Trim() -ne '39448837696') { throw 'Unexpected checkout owner' }
          $source = "$root\r\src\llvm-project"
          git -C $source status --short --untracked-files=no
          if ($LASTEXITCODE) { throw 'Cannot inspect failed checkout' }
          git -C $source diff --stat
          if ($LASTEXITCODE) { throw 'Cannot inspect checkout diff' }
          git -C $source diff --numstat
          if ($LASTEXITCODE) { throw 'Cannot inspect changed line counts' }
          git -C $source diff --summary
          if ($LASTEXITCODE) { throw 'Cannot inspect changed file modes' }
          git -C $source diff --ignore-space-at-eol --stat
          if ($LASTEXITCODE) { throw 'Cannot inspect line-ending differences' }
  upstream:
    if: inputs.run_releases || github.ref_name == 'experiment/x64-pgo-comparison-pilot'
    needs: preflight
    uses: ./.github/workflows/x64-pgo-release-cell.yml
    with:
      variant: upstream
  local:
    needs: upstream
    uses: ./.github/workflows/x64-pgo-release-cell.yml
    with:
      variant: local
