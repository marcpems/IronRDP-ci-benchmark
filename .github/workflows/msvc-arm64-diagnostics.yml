name: Diagnose Microsoft-linked LLVM PGO runtime
on:
  push:
    branches: [experiment/windows-msvc-diagnostics]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    working-directory: harness
jobs:
  llvm-profile:
    if: github.repository == 'marcpems/IronRDP-ci-benchmark'
    name: ${{ matrix.arch }} / LLVM PGO feasibility
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: windows-11-arm
            host: aarch64-pc-windows-msvc
            frontend-run: 38001265175
            frontend-artifact: msvc-arm64-instrumented-diagnostics
    steps:
      - uses: actions/checkout@v6
        with:
          path: harness
      - uses: ./harness/.github/actions/prepare-msvc-experiment
        with:
          architecture: ${{ matrix.arch }}
          rust-revision: 5b615ab3eb2cd5a26afc6025b5863180ffdc20d7
      - uses: actions/checkout@v6
        with:
          repository: llvm/llvm-project
          ref: ca7933e47d3a3451d81e72ac174dcb5aa28b59d1
          path: clang-runtime-source
          persist-credentials: false
          sparse-checkout: |
            compiler-rt
            cmake
            llvm/cmake
            llvm/include/llvm/Config
      - name: Apply locally validated profiling-runtime padding fixes
        shell: pwsh
        run: |
          $patch = (Resolve-Path .github\scripts\msvc-profile-runtime.patch).Path
          git -C ..\rust-source\src\llvm-project apply --check $patch
          if ($LASTEXITCODE) { throw 'Runtime patch does not match pinned LLVM source' }
          git -C ..\rust-source\src\llvm-project apply $patch
          if ($LASTEXITCODE) { throw 'Runtime patch application failed' }
          git -C ..\clang-runtime-source apply --check $patch
          if ($LASTEXITCODE) { throw 'Runtime patch does not match Clang 22 source' }
          git -C ..\clang-runtime-source apply $patch
          if ($LASTEXITCODE) { throw 'Clang runtime patch application failed' }
      - uses: actions/download-artifact@v6
        with:
          name: ${{ matrix.frontend-artifact }}
          run-id: ${{ matrix.frontend-run }}
          github-token: ${{ github.token }}
          path: harness/profiles
      - name: Capture unhandled compiler exceptions
        shell: pwsh
        run: |
          $folder = Join-Path (Get-Location) 'crash-dumps'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\rustc.exe'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value $folder -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -PropertyType DWord -Value 4 -Force | Out-Null
      - name: Validate Clang runtime and train instrumented LLVM
        shell: pwsh
        run: |
          .github\scripts\invoke_msvc_experiment.ps1 -Architecture ${{ matrix.arch }} -Script .github\scripts\msvc_experiment.py --source ..\rust-source --output evidence --clang tools\clang\bin --host ${{ matrix.host }} --phase llvm-profile --profiles profiles --preserve-training-compiler --clang-runtime-source ..\clang-runtime-source
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: msvc-${{ matrix.arch }}-llvm-diagnostics
          path: |
            harness/evidence/*.json
            harness/evidence/*.toml
            harness/evidence/*.cmake
            harness/evidence/*.txt
            harness/evidence/*.stdout
            harness/evidence/*.stderr
            harness/evidence/*.profdata
            harness/evidence/instrumented-diagnostic.zip
            harness/crash-dumps/*.dmp
          if-no-files-found: error
          retention-days: 30
  x64-compilers:
    if: github.repository == 'marcpems/IronRDP-ci-benchmark'
    name: x64 / ${{ matrix.phase }} compiler
    runs-on: windows-2025
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        phase: [baseline, pgo, pgo-rust-thin]
    steps:
      - uses: actions/checkout@v6
        with:
          path: harness
      - uses: ./harness/.github/actions/prepare-msvc-experiment
        with:
          architecture: x64
          rust-revision: 5b615ab3eb2cd5a26afc6025b5863180ffdc20d7
      - name: Apply identical in-tree runtime fixes to all variants
        shell: pwsh
        run: |
          $patch = (Resolve-Path .github\scripts\msvc-profile-runtime.patch).Path
          git -C ..\rust-source\src\llvm-project apply --check $patch
          if ($LASTEXITCODE) { throw 'Runtime patch does not match pinned LLVM source' }
          git -C ..\rust-source\src\llvm-project apply $patch
          if ($LASTEXITCODE) { throw 'Runtime patch application failed' }
      - uses: actions/download-artifact@v6
        if: matrix.phase != 'baseline'
        with:
          name: msvc-x64-llvm-diagnostics
          run-id: 38009549235
          github-token: ${{ github.token }}
          path: harness/profiles
      - name: Build final compiler with verified profiles
        shell: pwsh
        run: |
          .github\scripts\invoke_msvc_experiment.ps1 -Architecture x64 -Script .github\scripts\msvc_experiment.py --source ..\rust-source --output evidence --clang tools\clang\bin --host x86_64-pc-windows-msvc --phase ${{ matrix.phase }} --profiles profiles
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: msvc-x64-${{ matrix.phase }}
          path: |
            harness/evidence/*.json
            harness/evidence/*.toml
            harness/evidence/*.cmake
            harness/evidence/*.txt
            harness/evidence/*.stdout
            harness/evidence/*.stderr
            harness/evidence/*.profdata
            harness/evidence/*.zip
          if-no-files-found: error
          retention-days: 30
