name: Diagnose Microsoft-linked LLVM PGO runtime
on:
  push:
    branches: [experiment/windows-msvc-diagnostics]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    working-directory: harness
jobs:
  llvm-profile:
    if: github.repository == 'marcpems/IronRDP-ci-benchmark'
    name: ${{ matrix.arch }} / LLVM PGO feasibility
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: windows-11-arm
            host: aarch64-pc-windows-msvc
            frontend-run: 38001265175
            frontend-artifact: msvc-arm64-instrumented-diagnostics
    steps:
      - uses: actions/checkout@v6
        with:
          path: harness
      - uses: ./harness/.github/actions/prepare-msvc-experiment
        with:
          architecture: ${{ matrix.arch }}
          rust-revision: 5b615ab3eb2cd5a26afc6025b5863180ffdc20d7
      - name: Apply locally validated profiling-runtime padding fixes
        shell: pwsh
        run: |
          $patch = (Resolve-Path .github\scripts\msvc-profile-runtime.patch).Path
          git -C ..\rust-source\src\llvm-project apply --check $patch
          if ($LASTEXITCODE) { throw 'Runtime patch does not match pinned LLVM source' }
          git -C ..\rust-source\src\llvm-project apply $patch
          if ($LASTEXITCODE) { throw 'Runtime patch application failed' }
          $bootstrapPatch = (Resolve-Path .github\scripts\msvc-bootstrap-runtime-path.patch).Path
          git -C ..\rust-source apply --check $bootstrapPatch
          if ($LASTEXITCODE) { throw 'Bootstrap patch does not match pinned Rust source' }
          git -C ..\rust-source apply $bootstrapPatch
          if ($LASTEXITCODE) { throw 'Bootstrap runtime path patch failed' }
      - uses: actions/download-artifact@v6
        with:
          name: ${{ matrix.frontend-artifact }}
          run-id: ${{ matrix.frontend-run }}
          github-token: ${{ github.token }}
          path: harness/profiles
      - uses: actions/download-artifact@v6
        with:
          name: msvc-arm64-llvm-diagnostics
          run-id: 38031778830
          github-token: ${{ github.token }}
          path: harness/captured
      - name: Capture unhandled compiler exceptions
        shell: pwsh
        run: |
          $folder = Join-Path (Get-Location) 'crash-dumps'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\rustc.exe'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value $folder -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -PropertyType DWord -Value 4 -Force | Out-Null
      - name: Audit preserved compiler and resume LLVM training
        shell: pwsh
        run: |
          .github\scripts\invoke_msvc_experiment.ps1 -Architecture ${{ matrix.arch }} -Script .github\scripts\msvc_experiment.py --source ..\rust-source --output evidence --clang tools\clang\bin --host ${{ matrix.host }} --phase llvm-profile --profiles profiles --preserve-training-compiler --resume-build captured\evidence
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: msvc-${{ matrix.arch }}-llvm-diagnostics
          path: |
            harness/evidence/*.json
            harness/evidence/*.toml
            harness/evidence/*.cmake
            harness/evidence/*.txt
            harness/evidence/*.stdout
            harness/evidence/*.stderr
            harness/evidence/*.profdata
            harness/evidence/instrumented-diagnostic.zip
            harness/crash-dumps/*.dmp
          if-no-files-found: error
          retention-days: 30
