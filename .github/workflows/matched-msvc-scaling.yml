name: MSVC PGO and Rust ThinLTO release CPU scaling
on:
  push:
    branches: [experiment/msvc-rust-thin-scaling]
permissions:
  contents: read
jobs:
  x64-16:
    uses: ./.github/workflows/matched-scaling-cell.yml
    with:
      machine: x64
      cores: 16
  x64-4:
    needs: x64-16
    uses: ./.github/workflows/matched-scaling-cell.yml
    with:
      machine: x64
      cores: 4
  arm64-16:
    uses: ./.github/workflows/matched-scaling-cell.yml
    with:
      machine: arm64
      cores: 16
  arm64-4:
    needs: arm64-16
    uses: ./.github/workflows/matched-scaling-cell.yml
    with:
      machine: arm64
      cores: 4
  highcore-32:
    uses: ./.github/workflows/matched-scaling-cell.yml
    with:
      machine: arm64-highcore
      cores: 32
  highcore-16:
    needs: highcore-32
    uses: ./.github/workflows/matched-scaling-cell.yml
    with:
      machine: arm64-highcore
      cores: 16
  highcore-4:
    needs: highcore-16
    uses: ./.github/workflows/matched-scaling-cell.yml
    with:
      machine: arm64-highcore
      cores: 4
