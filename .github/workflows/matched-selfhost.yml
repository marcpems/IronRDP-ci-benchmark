name: Validate self-hosted Windows release runner
on:
  push:
    branches: [experiment/matched-arm64-selfhost-validate, experiment/matched-x64-selfhost-validate, experiment/matched-highcore-arm64-selfhost-validate]
  workflow_dispatch:
    inputs:
      architecture:
        description: Native runner architecture
        type: choice
        options: [arm64, x64]
        default: arm64
permissions:
  contents: read
concurrency:
  group: ${{ contains(github.ref_name, '-highcore-') && 'matched-highcore-arm64-selfhost' || format('matched-{0}-selfhost', inputs.architecture || (contains(github.ref_name, '-x64-') && 'x64' || 'arm64')) }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'marcpems/IronRDP-ci-benchmark'
    runs-on: ${{ fromJSON(contains(github.ref_name, '-highcore-') && '["self-hosted","Windows","ARM64","HighCoreCount"]' || (inputs.architecture || (contains(github.ref_name, '-x64-') && 'x64' || 'arm64')) == 'x64' && '["self-hosted","Windows","X64"]' || '["self-hosted","Windows","ARM64"]') }}
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      VSCMD_SKIP_SENDTELEMETRY: "1"
      VALIDATION_ARCH: ${{ contains(github.ref_name, '-highcore-') && 'arm64' || inputs.architecture || (contains(github.ref_name, '-x64-') && 'x64' || 'arm64') }}
      VALIDATION_HIGHCORE: ${{ contains(github.ref_name, '-highcore-') }}
    steps:
      - name: Inspect runner and reserve isolated short paths
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedName = if ($env:VALIDATION_HIGHCORE -eq 'true') { 'GB300-Arm64' } elseif ($env:VALIDATION_ARCH -eq 'x64') { 'MARCPE-TEST01-X64' } else { 'MARCPE-D4-Arm64' }
          if ($env:RUNNER_NAME -ne $expectedName) { throw 'Unexpected self-hosted runner' }
          if ($env:RUNNER_ARCH -ne $env:VALIDATION_ARCH) { throw 'Unexpected runner architecture' }
          $root = Join-Path ([IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE)) "v$($env:GITHUB_RUN_ID.Substring($env:GITHUB_RUN_ID.Length - 8))"
          if (Test-Path $root) { throw "Refusing to reuse $root" }
          New-Item -ItemType Directory "$root\e","$root\t","$root\c" | Out-Null
          "SELFHOST_ROOT=$root" >> $env:GITHUB_ENV
          "CARGO_HOME=$root\c" >> $env:GITHUB_ENV
          "TEMP=$root\t" >> $env:GITHUB_ENV
          "TMP=$root\t" >> $env:GITHUB_ENV
          Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors | ConvertTo-Json > "$root\e\cpu.json"
          @{RunnerName=$env:RUNNER_NAME; RunnerArch=$env:RUNNER_ARCH; Machine=$env:COMPUTERNAME; Environment=$env:RUNNER_ENVIRONMENT} | ConvertTo-Json > "$root\e\runner.json"
          foreach ($tool in @('git','tar','cmake','ninja','7z')) {
            $command = Get-Command $tool -ErrorAction Stop
            Write-Output "$tool = $($command.Source)"
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw 'Visual Studio Installer/vswhere missing' }
          & $vswhere -latest -products '*' -property installationPath
      - uses: actions/checkout@v6
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: marcpems/rust-arm64-compiler-ab
          ref: 7db17d9b5bbe6b16be2dc86b4bfae81d6e1ae238
          path: rust-source
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: Devolutions/IronRDP
          ref: 0c5419eca6bf53563056ed252f537bca67862705
          path: workload
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: ${{ env.VALIDATION_ARCH }}
      - name: Build native compiler component and IronRDP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [IO.Directory]::Move((Resolve-Path rust-source).Path, "$env:SELFHOST_ROOT\r")
          [IO.Directory]::Move((Resolve-Path workload).Path, "$env:SELFHOST_ROOT\s")
          harness\.github\scripts\invoke_msvc_experiment.ps1 -Architecture $env:VALIDATION_ARCH -Script harness\.github\scripts\validate_selfhost.py --root "$env:SELFHOST_ROOT" --architecture $env:VALIDATION_ARCH
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: selfhost-${{ env.VALIDATION_ARCH }}-validation
          path: ${{ env.SELFHOST_ROOT }}/e
          retention-days: 30
